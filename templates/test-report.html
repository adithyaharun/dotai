<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f7f8;--surface:#fff;--fg:#16191d;--muted:#5f6871;--line:#e1e4e8;--accent:#0b6e8a;
  --ok:#1a7f4b;--bad:#c4362c;--warn:#9a6300;--run:#2563c9;--skip:#7d858e;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1113;--surface:#16191c;--fg:#e5e8ea;--muted:#97a0a9;--line:#2a2f34;--accent:#55b6d1;
  --ok:#4cc584;--bad:#f06b60;--warn:#e2a63c;--run:#73a2f2;--skip:#737b84;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1113;--surface:#16191c;--fg:#e5e8ea;--muted:#97a0a9;--line:#2a2f34;--accent:#55b6d1;
  --ok:#4cc584;--bad:#f06b60;--warn:#e2a63c;--run:#73a2f2;--skip:#737b84;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
header{display:grid;gap:4px}
.sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.phases{display:flex;flex-wrap:wrap;gap:4px;font:12px var(--mono)}
.phases span{padding:2px 8px;border-radius:4px;color:var(--muted);border:1px solid var(--line)}
.phases .done{color:var(--fg)}
.phases .now{color:var(--surface);background:var(--accent);border-color:var(--accent)}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.verdict{font:600 12px var(--mono);letter-spacing:.04em;padding:5px 10px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.chip{font:12px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:500;color:var(--c,var(--fg))}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar i{display:block;background:var(--c)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 5.6rem 6.2rem;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.head{font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:8px}
.title{font-weight:500;overflow-wrap:anywhere}
.p0{font:600 10px var(--mono);color:var(--bad);margin-right:6px;vertical-align:1px}
.p1,.p2{font:10px var(--mono);color:var(--muted);margin-right:6px;vertical-align:1px}
.meta,.ev{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ev{color:var(--fg);opacity:.85}
.ev.bad{color:var(--bad);opacity:1}
.ev.warn{color:var(--warn);opacity:1}
.st{font:500 11px var(--mono);letter-spacing:.04em;justify-self:start;padding:2px 7px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.st.PENDING{background:none;border:1px dashed var(--line)}
.st.RUNNING::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.st.RUNNING::before{animation:none}}
.cl{font:12px var(--mono);color:var(--muted)}
.cl.Confusing{color:var(--warn);font-weight:500}
.cl.Clear{color:var(--ok)}
.empty{padding:28px 14px;color:var(--muted);text-align:center}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
summary{cursor:pointer;font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
details pre,details ul{margin:10px 0 0;font:12px/1.55 var(--mono);overflow-x:auto}
details ul{padding-left:18px}
footer{font:11px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--skip)}
.dot.live{background:var(--ok)}
.PASS{--c:var(--ok)}.FAIL{--c:var(--bad)}.BLOCKED{--c:var(--warn)}.RUNNING{--c:var(--run)}.PENDING{--c:var(--skip)}.SKIPPED{--c:var(--skip)}
.v-ok{--c:var(--ok)}.v-bad{--c:var(--bad)}.v-warn{--c:var(--warn)}.v-run{--c:var(--run)}.v-idle{--c:var(--skip)}
@media (max-width:640px){
  .row{grid-template-columns:3rem minmax(0,1fr) auto}
  .row.head{display:none}
  .row .cl{grid-column:2/4}
}
</style>
<div class="wrap">
  <header>
    <h1 id="target">Waiting for the test run</h1>
    <div class="sub mono" id="sub"></div>
  </header>
  <div class="phases" id="phases"></div>
  <div class="summary" id="summary"></div>
  <div class="bar" id="bar"></div>
  <div class="list" id="list"></div>
  <details id="tests" hidden><summary>New tests</summary><ul id="testsList"></ul></details>
  <details id="flow" hidden><summary>Flow</summary><pre id="flowText"></pre></details>
  <footer><span class="dot" id="dot"></span><span id="foot">not connected</span></footer>
</div>
<script>
const PHASES=["intake","explore","plan","automate","run","triage","done"];
const STATUSES=["FAIL","BLOCKED","RUNNING","PENDING","PASS","SKIPPED"];
const S={meta:{},rows:[],filter:"all",at:0,mode:""};
const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function status(r){return STATUSES.includes(r.status)?r.status:"PENDING"}
function verdict(rows,phase){
  const has=(...s)=>rows.some(r=>s.includes(status(r)));
  if(!rows.length)return["WAITING","idle"];
  if(rows.some(r=>r.pri==="P0"&&["FAIL","BLOCKED","SKIPPED"].includes(status(r))))return["NOT READY","bad"];
  if(phase==="done"&&rows.every(r=>["PENDING","SKIPPED"].includes(status(r))))return["PLANNED","idle"];
  if(has("PENDING","RUNNING"))return["IN PROGRESS","run"];
  if(has("FAIL","BLOCKED","SKIPPED")||rows.some(r=>r.clarity==="Confusing"))return["READY WITH NOTES","warn"];
  return["READY","ok"];
}
function chip(key,label,count,cls){
  const b=el("button","chip "+(cls||""));b.type="button";
  b.setAttribute("aria-pressed",S.filter===key);
  b.append(el("b",null,String(count)),el("span",null,label));
  b.onclick=()=>{S.filter=S.filter===key?"all":key;render()};
  return b;
}
function matches(r){
  if(S.filter==="all")return true;
  if(S.filter==="Confusing")return r.clarity==="Confusing";
  return status(r)===S.filter;
}
function render(){
  const m=S.meta,rows=S.rows;
  $("target").textContent=m.target||"Waiting for the test run";
  const sub=$("sub");sub.replaceChildren();
  [m.project,m.env,m.sha&&String(m.sha).slice(0,8),rows.length?rows.length+" scenarios":""].filter(Boolean).forEach(t=>sub.append(el("span",null,t)));
  const ph=$("phases");ph.replaceChildren();const pi=PHASES.indexOf(m.phase);
  PHASES.forEach((p,i)=>ph.append(el("span",i<pi?"done":i===pi?"now":"",p)));
  const [vt,vc]=verdict(rows,m.phase);
  const sm=$("summary");sm.replaceChildren(el("span","verdict v-"+vc,vt));
  if(rows.length)sm.append(chip("all","all",rows.length));
  STATUSES.forEach(s=>{const n=rows.filter(r=>status(r)===s).length;if(n)sm.append(chip(s,s.toLowerCase(),n,s))});
  const nc=rows.filter(r=>r.clarity==="Confusing").length;
  if(nc)sm.append(chip("Confusing","confusing",nc,"BLOCKED"));
  const bar=$("bar");bar.replaceChildren();bar.hidden=!rows.length;
  STATUSES.forEach(s=>{const n=rows.filter(r=>status(r)===s).length;if(n){const i=el("i",s);i.style.width=(100*n/rows.length)+"%";i.title=n+" "+s;bar.append(i)}});
  const list=$("list");list.replaceChildren();
  if(!rows.length){list.append(el("div","empty","No scenarios yet. The /test run adds them here as it plans, then updates each one as it runs."))}
  else{
    const h=el("div","row head");["id","scenario","status","clarity"].forEach(t=>h.append(el("span",null,t)));list.append(h);
    const shown=rows.filter(matches);
    if(!shown.length)list.append(el("div","empty","No scenarios match this filter."));
    shown.forEach(r=>{
      const st=status(r),row=el("div","row");
      const mid=el("div");mid.style.minWidth="0";
      const t=el("div","title");if(r.pri)t.append(el("span",String(r.pri).toLowerCase(),String(r.pri)));t.append(String(r.title||""));mid.append(t);
      const meta=[r.type,r.layer,r.source,r.cov].filter(Boolean).join(" · ");if(meta)mid.append(el("div","meta",meta));
      if(r.evidence)mid.append(el("div","ev",r.evidence));
      if(r.triage)mid.append(el("div","ev bad",r.triage));
      if(r.note)mid.append(el("div","ev warn",r.note));
      const cl=String(r.clarity||"");
      row.append(el("span","mono muted",String(r.id)),mid,el("span","st "+st,st),el("span","cl "+cl,cl||"–"));
      list.append(row);
    });
  }
  const tests=Array.isArray(m.tests)?m.tests:[];
  $("tests").hidden=!tests.length;$("testsList").replaceChildren(...tests.map(t=>el("li",null,t)));
  $("flow").hidden=!m.flow;$("flowText").textContent=m.flow||"";
  foot();
}
function foot(){
  $("dot").className="dot"+(S.mode?" live":"");
  if(!S.mode){$("foot").textContent="not connected";return}
  const s=Math.round((Date.now()-S.at)/1000);
  $("foot").textContent=(S.mode==="db"?"live":"polling report.js")+(S.at?" · updated "+(s<60?s+"s":Math.round(s/60)+"m")+" ago":"");
}
function tick(){S.at=Date.now();render()}
function sortRows(a){return a.sort((x,y)=>String(x.id).localeCompare(String(y.id),undefined,{numeric:true}))}
let last="";
function poll(){
  const s=document.createElement("script");s.src="report.js?t="+Date.now();
  s.onload=()=>{s.remove();const r=window.REPORT;if(!r)return;S.mode="file";const k=JSON.stringify(r);if(k!==last){last=k;S.meta=r.meta||{};S.rows=sortRows([...(r.scenarios||[])]);tick()}};
  s.onerror=()=>s.remove();
  document.head.append(s);setTimeout(poll,4000);
}
async function boot(){
  render();setInterval(foot,5000);
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){poll();return}
  subscribe(db);
}
function subscribe(db){
  S.mode="db";foot();
  let subs=[],dead=false;
  const fail=()=>{if(dead)return;dead=true;subs.forEach(u=>u());S.mode="";foot();setTimeout(()=>subscribe(db),10000)};
  subs=[
    db.doc("run/meta").onSnapshot(s=>{S.meta=s.exists?s.data()||{}:{};tick()},fail),
    db.collection("scenarios").onSnapshot(q=>{S.rows=sortRows(q.docs.map(d=>({id:d.id,...d.data()})));tick()},fail)
  ];
}
boot();
</script>
